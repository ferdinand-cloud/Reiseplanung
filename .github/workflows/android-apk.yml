# Baut auf Knopfdruck („Run workflow“) eine Test-APK für Android aus native/.
# Läuft nicht automatisch bei Push; die PWA ist davon nicht betroffen.
name: Android-Test-APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Abhängigkeiten
        run: npm install
      - name: Android-Projekt erzeugen
        run: |
          node scripts/copy-web.mjs
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Debug-APK bauen
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: reiseplan-debug-apk
          path: native/android/app/build/outputs/apk/debug/*.apk
